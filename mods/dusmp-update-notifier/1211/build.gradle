plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'online.dusmp'
base { archivesName = "dusmp-update-notifier-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    mods { dusmp_update_notifier { sourceSet sourceSets.main } }
}
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
